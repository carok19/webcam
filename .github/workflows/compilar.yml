name: Compilar APK y receptor

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: App Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CamaraNDI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CamaraNDI-apk
          path: android-app/CamaraNDI.apk

  windows:
    name: Receptor Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pruebas (las de punta a punta se omiten si no hay FFmpeg en el sistema)
        run: dotnet test windows-receiver/tests/CamaraNdi.Tests -c Release
      - name: Publicar versión completa (incluye .NET)
        run: dotnet publish windows-receiver/src/ReceptorNdi -c Release -r win-x64 -o out/completo/ReceptorCamaraNDI
      - name: Publicar versión ligera (requiere .NET 8 Desktop Runtime)
        run: dotnet publish windows-receiver/src/ReceptorNdi -c Release -r win-x64 --self-contained false -p:EnableCompressionInSingleFile=false -o out/ligero/ReceptorCamaraNDI
      - name: Comprimir
        shell: pwsh
        run: |
          Compress-Archive -Path out/completo/ReceptorCamaraNDI -DestinationPath ReceptorCamaraNDI-win-x64.zip
          Compress-Archive -Path out/ligero/ReceptorCamaraNDI -DestinationPath ReceptorCamaraNDI-win-x64-ligero.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ReceptorCamaraNDI-win-x64
          path: |
            ReceptorCamaraNDI-win-x64.zip
            ReceptorCamaraNDI-win-x64-ligero.zip

  pruebas-linux:
    name: Pruebas de punta a punta (Linux + FFmpeg)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Instalar FFmpeg 6.1
        run: sudo apt-get update && sudo apt-get install -y libavcodec60 libavutil58
      - name: Pruebas
        run: dotnet test windows-receiver/tests/CamaraNdi.Tests -c Release --logger "console;verbosity=normal"

  release:
    name: Publicar Release
    # Se publica al subir una etiqueta v*, o con un commit cuyo mensaje contenga "[release]"
    # (en ese caso Actions crea la etiqueta v1.0.<número de ejecución>).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: [android, windows, pruebas-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
      - name: Crear Release con los archivos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Cámara NDI ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          make_latest: true
          body: |
            **Descargas**
            - `CamaraNDI.apk` — app para el celular (Android 8 o superior).
            - `ReceptorCamaraNDI-win-x64.zip` — receptor para Windows 10/11, no requiere instalar nada más que NDI Tools.
            - `ReceptorCamaraNDI-win-x64-ligero.zip` — igual pero más pequeño; requiere el ".NET 8 Desktop Runtime x64" de Microsoft.

            En el PC hace falta **NDI Tools** (https://ndi.video/tools/). Instrucciones completas en el README.
          files: |
            artefactos/CamaraNDI.apk
            artefactos/ReceptorCamaraNDI-win-x64.zip
            artefactos/ReceptorCamaraNDI-win-x64-ligero.zip
